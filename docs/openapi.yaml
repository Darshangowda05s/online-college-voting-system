openapi: 3.0.3
info:
  title: College Election API
  description: API documentation for the college election full-stack application.
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Local development server
paths:
  /api/auth/google:
    post:
      tags:
        - Authentication
      summary: Sign in with Google credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - credential
              properties:
                credential:
                  type: string
                  description: Google ID token from the client
      responses:
        '200':
          description: Logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Email not verified or invalid credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden domain or invalid email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Login failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh an access token using refresh cookie
      description: Requires the refreshToken cookie set by login.
      security:
        - refreshCookieAuth: []
      responses:
        '200':
          description: Access token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Missing or invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Token refresh failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out and clear authentication cookies
      security:
        - refreshCookieAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '500':
          description: Logout failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/users/me:
    get:
      tags:
        - User
      summary: Get current authenticated user profile
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to fetch user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/dashboard:
    get:
      tags:
        - Admin
      summary: Sample admin-only route
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Admin welcome message
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/elections:
    get:
      tags:
        - Elections
      summary: List elections for the authenticated user
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of elections with voting metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  elections:
                    type: array
                    items:
                      $ref: '#/components/schemas/ElectionSummary'
        '500':
          description: Failed to fetch elections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Elections
      summary: Create a new election (admin only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElectionCreateRequest'
      responses:
        '201':
          description: Election created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  election:
                    $ref: '#/components/schemas/Election'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to create election
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/elections/{id}:
    get:
      tags:
        - Elections
      summary: Get election details
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Election details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  election:
                    $ref: '#/components/schemas/ElectionDetail'
        '404':
          description: Election not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to fetch election
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Elections
      summary: Update an existing election (admin only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElectionCreateRequest'
      responses:
        '200':
          description: Election updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  election:
                    $ref: '#/components/schemas/Election'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Election not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to update election
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Elections
      summary: Delete an election (admin only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Election deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Election not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to delete election
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/elections/{id}/vote:
    post:
      tags:
        - Elections
      summary: Cast a vote for a candidate in an election
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - candidateId
              properties:
                candidateId:
                  type: string
      responses:
        '200':
          description: Vote cast successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Bad request or voting not open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Election not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Already voted in this election
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to cast vote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/elections/{id}/results:
    get:
      tags:
        - Elections
      summary: Get election results after voting ends
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Election results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsResponse'
        '403':
          description: Results available only after election ends
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Election not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to fetch results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: Use the accessToken cookie set by /api/auth/google.
    refreshCookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken
      description: Use the refreshToken cookie set by /api/auth/google.
  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
        googleId:
          type: string
        email:
          type: string
        name:
          type: string
        picture:
          type: string
        role:
          type: string
          enum:
            - student
            - admin
        hasVoted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Candidate:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        photo:
          type: string
        bio:
          type: string
        department:
          type: string
        year:
          type: string
        voteCount:
          type: integer
        percentage:
          type: number
          format: float
    Election:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - scheduled
            - active
            - ended
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        totalVoters:
          type: integer
        totalEligibleVoters:
          type: integer
        voters:
          type: array
          items:
            type: string
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ElectionSummary:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - scheduled
            - active
            - ended
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        totalVoters:
          type: integer
        totalEligibleVoters:
          type: integer
        hasVoted:
          type: boolean
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
    ElectionDetail:
      allOf:
        - $ref: '#/components/schemas/ElectionSummary'
        - type: object
          properties:
            votedCandidateId:
              type: string
    ElectionCreateRequest:
      type: object
      required:
        - title
        - description
        - startTime
        - endTime
        - candidates
        - totalEligibleVoters
      properties:
        title:
          type: string
        description:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        totalEligibleVoters:
          type: integer
        candidates:
          type: array
          items:
            type: object
            required:
              - name
              - photo
              - bio
              - department
              - year
            properties:
              name:
                type: string
              photo:
                type: string
              bio:
                type: string
              department:
                type: string
              year:
                type: integer
    ResultsResponse:
      type: object
      properties:
        success:
          type: boolean
        results:
          type: object
          properties:
            title:
              type: string
            endTime:
              type: string
              format: date-time
            totalVotes:
              type: integer
            candidates:
              type: array
              items:
                type: object
                properties:
                  _id:
                    type: string
                  name:
                    type: string
                  photo:
                    type: string
                  voteCount:
                    type: integer
                  percentage:
                    type: number
                    format: float
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        user:
          $ref: '#/components/schemas/User'
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
